<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- 底色：上浅下深，但两端都抬了一点，避免近黑底与纯白字的高反差生硬感 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop stop-color="#1a2130" />
      <stop offset="1" stop-color="#0a0f17" />
    </linearGradient>
    <!-- 字标后的柔光，提供一点纵深 -->
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.46">
      <stop stop-color="#7f9ad8" stop-opacity="0.10" />
      <stop offset="1" stop-color="#7f9ad8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff" />
      <stop offset="1" stop-color="#dbe3f2" />
    </linearGradient>
    <path
      id="tile"
      d="M268 64 H756 C848 64 960 176 960 268 V756 C960 848 848 960 756 960 H268 C176 960 64 848 64 756 V268 C64 176 176 64 268 64 Z"
    />
  </defs>
  <!-- squircle 底板：圆角用三次曲线收束，接近 macOS 连续曲率，比等半径圆角更柔 -->
  <use href="#tile" fill="url(#bg)" />
  <use href="#tile" fill="url(#glow)" />
  <!-- 顶缘极淡内高光，暗示受光方向 -->
  <use href="#tile" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2" />
  <!-- U 字标：圆头笔画、外底 r88 / 内底 r32、笔画 56（外框 176×204 不变，加粗只向内收）；字形缩小后必须同步加粗，否则笔画显细 -->
  <path
    transform="translate(192 227) scale(2.5)"
    d="M40 40 A28 28 0 0 1 96 40 L96 128 A32 32 0 0 0 160 128 L160 40 A28 28 0 0 1 216 40 L216 128 A88 88 0 0 1 40 128 Z"
    fill="url(#mark)"
  />
</svg>
