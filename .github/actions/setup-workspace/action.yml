name: Set up the pinned workspace toolchain
description: Read mise.toml and packageManager before installing Node and pnpm
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: node scripts/ci-toolchain.mjs
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.versions.outputs.node-version }}
    - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      with:
        version: ${{ steps.versions.outputs.pnpm-version }}
        cache: true
