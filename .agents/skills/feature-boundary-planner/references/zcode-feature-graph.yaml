        symbol: useRootWorkspaceActions
      - file: packages/services/src/project/index.ts
        symbol: createProjectService
      - file: packages/ui/src/v4/composer/composerDraftWorkspaceTransfer.ts
        symbol: captureV4ComposerDraftHandoff
      - file: packages/ui/src/v4/composer/composerDraftStore.ts
        symbol: clearV4ComposerDraftTaskGroup
    invariants:
      - "A Root draft with no original ModelSelection adopts the first valid target-host preferredSelection when providers become ready, preserving text, editor state, permission and Plan. Existing selections, including invalid ones, and existing/imported Sessions are never replaced by this rule. Recent still changes only on accepted Submission."
      - Only non-whitespace text creates a durable draft. Empty controls stay in the active Composer; New Task initializes from client-local host/project Recent; unclassified tasks have their own scope. Session restoration keeps draft text/model but takes permission and Plan from the current snapshot.
      - Historical grant/Plan records establish an observation baseline on entry; only newly observed changes update the mounted Composer. Observation IDs are never persisted in drafts. Reads are side-effect free.
      - Project/group creation intent accompanies durable text. Project ID isolates Root drafts even when primary roots match; formal session drafts retain workspace/session identity. Accepted user Submission updates frozen project Recent through the pending command registry. A pending task draft ID reuses its directory until accepted and protects later drafts from late acknowledgements.
