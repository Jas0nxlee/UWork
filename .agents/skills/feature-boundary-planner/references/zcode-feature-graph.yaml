    kind: state-owner
    label: Text-only Composer draft persistence
    docs: [docs/ui/composer-text-draft-persistence.md, docs/ui/project-task-draft-lifecycle.md]
    codeSeeds:
      - file: packages/ui/src/v4/composer/composerDraftStore.ts
        symbol: persistV4ComposerDraft
      - file: packages/ui/src/v4/composer/useDraftConfigControl.ts
        symbol: useDraftConfigControl
